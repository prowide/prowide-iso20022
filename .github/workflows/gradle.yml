# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time

name: Java CI with Gradle

on:
  push:
    branches: [ "main", "SRU2026", "SRU2025-java8-maintenance", "SRU2026-java8-maintenance" ]
#  pull_request:
#    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Set up JDK 11 for current development branches (main, next SRU)
      # Suffix match so every SRU<year>-java8-maintenance branch is covered, not one hardcoded name.
      - name: Set up JDK 11
        if: ${{ !endsWith(github.head_ref || github.ref_name, 'java8-maintenance') }}
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'

      # Set up JDK 8 only for the legacy Java 8 maintenance branches
      - name: Set up JDK 8
        if: ${{ endsWith(github.head_ref || github.ref_name, 'java8-maintenance') }}
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic  # MIT provider; the v6 default 'enhanced' is proprietary and paid for private repos

      - name: Build with Gradle Wrapper
        run: ./gradlew -Dorg.gradle.jvmargs="-Xms512m -Xmx7g" compileJava compileTestJava

      - name: Run test
        run: ./gradlew test --info

  # This job generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
  # We only run it on the default branch (main) to avoid duplicate alerts from maintenance branches.
  dependency-submission:
    if: github.ref == 'refs/heads/main' || github.head_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'

      # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
      # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          cache-provider: basic  # MIT provider; the v6 default 'enhanced' is proprietary and paid for private repos
          dependency-graph-exclude-projects: ':buildSrc'
